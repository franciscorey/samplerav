<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Sampler audiovisual de 8 pads con vídeo, MIDI, BPM y grabación."
  >

  <title>AV Sampler</title>

  <!--
    Tu CSS actual.
    Lo dejamos separado para trabajarlo después.
  -->
  <link rel="stylesheet" href="style.css">

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>
</head>

<body>

  <!-- =========================================================
       APP HEADER
       ========================================================= -->

  <header class="app-header">

    <div class="brand">

      <div
        class="brand-logo"
        aria-hidden="true"
      ></div>

      <div>
        <div class="brand-title">
          AV SAMPLER
        </div>

        <div class="brand-subtitle">
          audiovisual performance
        </div>
      </div>

    </div>


    <!-- MASTER / BPM -->

    <div class="master-vol-container">

      <label for="masterVolume">
        MASTER
      </label>

      <input
        id="masterVolume"
        type="range"
        min="0"
        max="1"
        step="0.01"
        value="0.8"
        aria-label="Volumen master"
      >

    </div>


    <div class="global-bpm-container">

      <div class="bpm-display">

        <span id="globalBpmValue">
          120
        </span>

        <small>BPM</small>

      </div>

      <button
        id="globalTapButton"
        class="btn-tap"
        type="button"
      >
        TAP
      </button>

    </div>


    <!-- STATUS -->

    <div
      id="statusBadge"
      class="status-badge"
      role="status"
      aria-live="polite"
    >

      <span
        id="statusDot"
        class="status-dot"
      ></span>

      <span id="statusText">
        READY
      </span>

    </div>


    <!-- HEADER ACTIONS -->

    <div class="header-controls">

      <button
        id="audioStartButton"
        class="btn"
        type="button"
      >
        AUDIO
      </button>

      <button
        id="loadProjectButton"
        class="btn"
        type="button"
      >
        LOAD
      </button>

      <button
        id="saveProjectButton"
        class="btn"
        type="button"
      >
        SAVE
      </button>

      <button
        id="recordButton"
        class="btn btn-rec"
        type="button"
      >
        REC
      </button>

    </div>

  </header>


  <!-- =========================================================
       MAIN LAYOUT
       ========================================================= -->

  <main class="app-layout">


    <!-- =======================================================
         LEFT / MAIN AREA
         ======================================================= -->

    <section class="main-area">


      <!-- =====================================================
           VISUAL OUTPUT
           ===================================================== -->

      <div
        id="canvasContainer"
        class="canvas-container"
      >

        <canvas
          id="outputCanvas"
          width="1280"
          height="720"
        ></canvas>


        <!--
          YouTube players viven aquí.
          Se mantienen fuera del flujo normal.
        -->

        <div
          id="ytPlayersContainer"
          aria-hidden="true"
        ></div>


        <!--
          Estado visual
        -->

        <div
          id="canvasOverlayTag"
          class="canvas-overlay-tag"
        >
          STANDBY
        </div>

      </div>


      <!-- =====================================================
           PAD GRID
           ===================================================== -->

      <section
        id="padsGrid"
        class="pads-grid"
        aria-label="Sampler pads"
      >
        <!--
          Los 8 pads son generados por JavaScript.
        -->
      </section>


    </section>


    <!-- =======================================================
         SIDEBAR
         ======================================================= -->

    <aside class="sidebar">


      <!-- =====================================================
           SELECTED PAD
           ===================================================== -->

      <section class="settings-card">

        <div class="card-title">
          PAD SELECCIONADO
        </div>

        <div
          id="selectedPadInfo"
          class="selected-pad-info"
        >
          <strong>
            PAD 1
          </strong>

          <span>
            Q
          </span>
        </div>

        <button
          id="visualMasterButton"
          class="btn"
          type="button"
        >
          USAR COMO VIDEO
        </button>

      </section>


      <!-- =====================================================
           KEYBOARD
           ===================================================== -->

      <section class="settings-card">

        <div class="card-title">
          KEYBOARD
        </div>

        <div
          id="keyboardMap"
          class="keyboard-map-grid"
        >

          <div>
            <kbd>Q</kbd>
            PAD 1
          </div>

          <div>
            <kbd>W</kbd>
            PAD 2
          </div>

          <div>
            <kbd>E</kbd>
            PAD 3
          </div>

          <div>
            <kbd>R</kbd>
            PAD 4
          </div>

          <div>
            <kbd>A</kbd>
            PAD 5
          </div>

          <div>
            <kbd>S</kbd>
            PAD 6
          </div>

          <div>
            <kbd>D</kbd>
            PAD 7
          </div>

          <div>
            <kbd>F</kbd>
            PAD 8
          </div>

        </div>

      </section>


      <!-- =====================================================
           MIDI
           ===================================================== -->

      <section class="settings-card">

        <div class="card-title">
          MIDI
        </div>

        <div class="form-group">

          <label
            class="form-label"
            for="midiInputSelect"
          >
            Entrada MIDI
          </label>

          <select
            id="midiInputSelect"
            class="form-select"
          >

            <option value="">
              MIDI no disponible
            </option>

          </select>

        </div>

        <div
          id="midiStatus"
          class="form-label"
        >
          MIDI desconectado
        </div>

      </section>


      <!-- =====================================================
           AUDIO OUTPUT
           ===================================================== -->

      <section class="settings-card">

        <div class="card-title">
          AUDIO
        </div>

        <div class="form-group">

          <label
            class="form-label"
            for="audioOutputSelect"
          >
            Salida
          </label>

          <select
            id="audioOutputSelect"
            class="form-select"
          >

            <option value="">
              Salida predeterminada
            </option>

          </select>

        </div>

        <button
          id="audioOutputRefresh"
          class="btn"
          type="button"
        >
          ACTUALIZAR SALIDAS
        </button>

      </section>


      <!-- =====================================================
           PROJECT
           ===================================================== -->

      <section class="settings-card">

        <div class="card-title">
          PROYECTO
        </div>

        <div class="form-group">

          <label class="form-label">
            Archivo
          </label>

          <div
            id="projectInfo"
            class="code-box"
          >
            Proyecto nuevo
          </div>

        </div>

        <button
          id="clearProjectButton"
          class="btn"
          type="button"
        >
          LIMPIAR PROYECTO
        </button>

      </section>


      <!-- =====================================================
           RECORDING
           ===================================================== -->

      <section class="settings-card">

        <div class="card-title">
          GRABACIÓN
        </div>

        <div
          id="recordingStatus"
          class="form-label"
        >
          No grabando
        </div>

        <div
          id="recordingTimer"
          class="code-box"
        >
          00:00
        </div>

      </section>


    </aside>

  </main>


  <!-- =========================================================
       HIDDEN FILE INPUTS
       ========================================================= -->

  <!-- Vídeo/audio local -->

  <input
    id="mediaFileInput"
    type="file"
    accept="video/*,audio/*"
    hidden
  >


  <!-- Proyecto JSON -->

  <input
    id="projectFileInput"
    type="file"
    accept="application/json,.json"
    hidden
  >


  <!-- =========================================================
       HIDDEN MEDIA BANK
       ========================================================= -->

  <div
    id="videoBank"
    hidden
    aria-hidden="true"
  ></div>


  <!-- =========================================================
       JAVASCRIPT
       ========================================================= -->

  <script src="app.js"></script>

</body>
</html>
